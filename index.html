<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr = (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                              protocols === 'vite-hmr' ||
                              (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/client')));
            if (isViteHmr) {
              const emitter = new EventTarget();
              emitter.readyState = 1;
              emitter.OPEN = 1;
              emitter.CLOSED = 3;
              emitter.send = function() {};
              emitter.close = function() {
                emitter.readyState = 3;
                emitter.dispatchEvent(new Event('close'));
              };
              setTimeout(() => {
                emitter.dispatchEvent(new Event('open'));
              }, 0);
              return emitter;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
        window.addEventListener('error', function(event) {
          const msg = event.message || '';
          const filename = event.filename || '';
          if (msg.includes('WebSocket') || filename.includes('@vite/client')) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      })();
    </script>
