<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Hands Gradient -->
    <linearGradient id="handsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Top Arc Path for "FundBridge" text -->
    <!-- Arc from left to right curving over the center -->
    <path id="fundBridgeArc" d="M 95 130 A 175 175 0 0 1 405 130" fill="none"/>
  </defs>

  <!-- Dark Background Canvas matching the logo -->
  <rect width="500" height="500" rx="36" fill="#000000"/>

  <!-- 1. Arched Text: FundBridge -->
  <text fill="#2563eb" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="2">
    <textPath href="#fundBridgeArc" startOffset="50%" text-anchor="middle">
      FundBridge
    </textPath>
  </text>

  <!-- 2. Green Circular Framing Arc -->
  <path d="M 158 152 A 130 130 0 0 1 342 152" stroke="#16a34a" stroke-width="6.5" stroke-linecap="round" fill="none"/>

  <!-- 3. Glowing Heart (Apex of the symbol) -->
  <path d="M 250 160 C 248 156, 212 134, 212 114 C 212 97, 226 86, 240 86 C 247 86, 250 91, 250 91 C 250 91, 253 86, 260 86 C 274 86, 288 97, 288 114 C 288 134, 252 156, 250 160 Z" fill="url(#heartGrad)"/>

  <!-- 4. Community Figures (Center: Blue Leader, Sides: Green Members) -->
  <!-- Left Member (Green) -->
  <circle cx="212" cy="192" r="14" fill="#16a34a"/>
  <path d="M 188 238 C 188 212, 198 206, 212 206 C 224 206, 230 212, 234 224 L 222 238 Z" fill="#16a34a"/>

  <!-- Right Member (Green) -->
  <circle cx="288" cy="192" r="14" fill="#16a34a"/>
  <path d="M 266 224 C 270 212, 276 206, 288 206 C 302 206, 312 212, 312 238 Z" fill="#16a34a"/>

  <!-- Center Key Person (Blue) -->
  <circle cx="250" cy="180" r="18" fill="#1d4ed8"/>
  <path d="M 218 252 C 218 214, 230 202, 250 202 C 270 202, 282 214, 282 252 Z" fill="#1d4ed8"/>

  <!-- 5. Green Sprouting Plant / Seedling on Left -->
  <g transform="translate(125, 135)">
    <!-- Right Leaf -->
    <path d="M 38 72 C 38 42, 62 18, 62 18 C 62 18, 68 45, 52 65 Z" fill="#16a34a"/>
    <!-- Left Leaf -->
    <path d="M 36 72 C 20 54, 10 32, 10 32 C 10 32, 32 32, 40 60 Z" fill="#15803d"/>
    <!-- Tiny Stem -->
    <path d="M 38 72 Q 40 82 42 90" stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 6. Economic Growth: Bar Chart & Gold Rupee Coins on Right -->
  <g transform="translate(310, 125)">
    <!-- Ascending Green Bar Chart -->
    <rect x="36" y="55" width="10" height="32" rx="2" fill="#16a34a"/>
    <rect x="50" y="40" width="10" height="47" rx="2" fill="#16a34a"/>
    <rect x="64" y="24" width="10" height="63" rx="2" fill="#16a34a"/>

    <!-- Green Trend Line Arrow -->
    <path d="M 2 70 Q 35 55 68 15" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <polygon points="68,10 74,24 61,19" fill="#16a34a"/>

    <!-- Stack of Gold Coins -->
    <!-- Coin 1 (Bottom) -->
    <ellipse cx="25" cy="85" rx="19" ry="6.5" fill="#f59e0b"/>
    <path d="M 6 85 C 6 88, 14 91, 25 91 C 36 91, 44 88, 44 85 L 44 88 C 44 91, 36 94, 25 94 C 14 94, 6 91, 6 88 Z" fill="#b45309"/>

    <!-- Coin 2 (Middle) -->
    <ellipse cx="25" cy="79" rx="19" ry="6.5" fill="#fbbf24"/>
    <path d="M 6 79 C 6 82, 14 85, 25 85 C 36 85, 44 82, 44 79 L 44 82 C 44 85, 36 88, 25 88 C 14 88, 6 85, 6 82 Z" fill="#d97706"/>

    <!-- Coin 3 (Top) -->
    <ellipse cx="25" cy="73" rx="19" ry="6.5" fill="#f59e0b"/>

    <!-- Prominent Gold Rupee Coin (₹) in front -->
    <circle cx="48" cy="92" r="21" fill="#f59e0b" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="48" y="100" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">₹</text>
  </g>

  <!-- 7. Two Large Cupped Caring Hands at the Base -->
  <!-- Left Hand & Palm -->
  <path d="M 134 200 C 140 220, 144 240, 160 258 C 172 272, 192 284, 214 290 C 235 296, 248 290, 250 268 C 242 274, 222 268, 202 254 C 182 240, 168 222, 160 205 C 154 216, 144 224, 134 200 Z" fill="#1d4ed8"/>
  <path d="M 152 232 C 168 252, 194 274, 230 282 C 244 285, 250 274, 250 262 C 234 266, 212 258, 192 242 C 174 228, 162 214, 152 232 Z" fill="#2563eb"/>
  <!-- Left Hand Thumb / Forefinger -->
  <path d="M 138 200 C 148 220, 172 234, 194 240 C 180 230, 164 218, 154 195 Z" fill="#1e40af"/>

  <!-- Right Hand & Palm -->
  <path d="M 366 200 C 360 220, 356 240, 340 258 C 328 272, 308 284, 286 290 C 265 296, 252 290, 250 268 C 258 274, 278 268, 298 254 C 318 240, 332 222, 340 205 C 346 216, 356 224, 366 200 Z" fill="#1e40af"/>
  <path d="M 348 232 C 332 252, 306 274, 270 282 C 256 285, 250 274, 250 262 C 266 266, 288 258, 308 242 C 326 228, 338 214, 348 232 Z" fill="#2563eb"/>
  <!-- Right Hand Thumb / Forefinger -->
  <path d="M 362 200 C 352 220, 328 234, 306 240 C 320 230, 336 218, 346 195 Z" fill="#1d4ed8"/>

  <!-- 8. Bold Typography: NGO (Blue) -->
  <text x="250" y="365" fill="#1d4ed8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="74" text-anchor="middle" letter-spacing="4">
    NGO
  </text>

  <!-- 9. Bold Typography: FUND MANAGEMENT (Green) -->
  <text x="250" y="408" fill="#16a34a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="30.5" text-anchor="middle" letter-spacing="2">
    FUND MANAGEMENT
  </text>

  <!-- 10. Bold Typography: SYSTEM (Green) -->
  <text x="250" y="446" fill="#16a34a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="31.5" text-anchor="middle" letter-spacing="5">
    SYSTEM
  </text>
</svg>
