<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <circle cx="500" cy="90" r="140" fill="#0d9488" opacity="0.12"/>
  <circle cx="90" cy="380" r="120" fill="#f59e0b" opacity="0.1"/>

  <!-- Isometric Dashboard Grid Card -->
  <rect x="50" y="60" width="500" height="330" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="50" y="60" width="500" height="50" rx="20" fill="#090d16" stroke="#1e293b"/>
  <circle cx="80" cy="85" r="6" fill="#ef4444"/>
  <circle cx="100" cy="85" r="6" fill="#f59e0b"/>
  <circle cx="120" cy="85" r="6" fill="#10b981"/>
  <rect x="150" y="75" width="220" height="20" rx="6" fill="#1e293b"/>
  <rect x="440" y="73" width="85" height="24" rx="8" fill="url(#glowTeal)"/>
  <text x="455" y="89" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">AUDITED</text>

  <!-- Left Side: Bar Charts -->
  <rect x="80" y="130" width="240" height="150" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <text x="96" y="155" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">Fund Inflow vs Disbursement</text>
  <!-- Chart Bars -->
  <rect x="100" y="210" width="22" height="50" rx="4" fill="#14b8a6"/>
  <rect x="126" y="225" width="22" height="35" rx="4" fill="#f59e0b"/>
  
  <rect x="160" y="180" width="22" height="80" rx="4" fill="#14b8a6"/>
  <rect x="186" y="200" width="22" height="60" rx="4" fill="#f59e0b"/>
  
  <rect x="220" y="165" width="22" height="95" rx="4" fill="#14b8a6"/>
  <rect x="246" y="190" width="22" height="70" rx="4" fill="#f59e0b"/>

  <!-- Right Side: Mini Metric Cards -->
  <rect x="340" y="130" width="180" height="68" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="365" cy="164" r="16" fill="rgba(13,148,136,0.2)"/>
  <path d="M358 164 L363 169 L372 160" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>
  <text x="390" y="155" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Raised</text>
  <text x="390" y="178" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">$1,482,500</text>

  <rect x="340" y="212" width="180" height="68" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="365" cy="246" r="16" fill="rgba(245,158,11,0.2)"/>
  <path d="M358 246 L372 246 M365 239 L365 253" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <text x="390" y="237" fill="#94a3b8" font-family="sans-serif" font-size="11">Disbursed Aid</text>
  <text x="390" y="260" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">$1,120,400</text>

  <!-- Bottom Floating Flow Badge -->
  <rect x="80" y="300" width="440" height="65" rx="12" fill="url(#cardGrad)" stroke="#1e293b"/>
  <circle cx="115" cy="332" r="18" fill="url(#glowTeal)"/>
  <text x="110" y="337" fill="#fff" font-family="sans-serif" font-size="14" font-weight="800">1</text>
  <text x="145" y="328" fill="#fff" font-family="sans-serif" font-size="12" font-weight="700">Instant UPI &amp; 80G Receipts</text>
  <text x="145" y="344" fill="#94a3b8" font-family="sans-serif" font-size="10">Direct ground verification &amp; zero fund loss</text>

  <circle cx="480" cy="332" r="15" fill="#10b981" opacity="0.2"/>
  <path d="M473 332 L478 337 L487 328" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
</svg>
