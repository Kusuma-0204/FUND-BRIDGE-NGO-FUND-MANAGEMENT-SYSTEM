<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" fill="none">
  <defs>
    <linearGradient id="bgAnimal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="dogHouseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="280" fill="url(#bgAnimal)"/>

  <!-- Background Foliage / Bushes -->
  <g fill="#059669" opacity="0.6">
    <circle cx="120" cy="180" r="40"/>
    <circle cx="150" cy="150" r="45"/>
    <circle cx="90" cy="200" r="35"/>
    <circle cx="410" cy="200" r="40"/>
    <circle cx="380" cy="170" r="45"/>
  </g>

  <!-- Doghouse on right -->
  <g transform="translate(310, 100)">
    <!-- Roof -->
    <polygon points="45,0 -5,45 95,45" fill="#064e3b"/>
    <polygon points="45,-6 -10,45 100,45" stroke="#10b981" stroke-width="4" fill="none"/>
    <!-- House Base -->
    <rect x="5" y="45" width="80" height="90" rx="4" fill="url(#dogHouseGrad)"/>
    <!-- Doorway -->
    <path d="M28 135 L28 85 C28 68, 62 68, 62 85 L62 135 Z" fill="#022c22"/>
    <!-- Paw print on roof peak -->
    <g fill="#34d399" transform="translate(45, 26) scale(0.7)">
      <ellipse cx="0" cy="5" rx="7" ry="5"/>
      <circle cx="-6" cy="-4" r="2.5"/>
      <circle cx="-2" cy="-7" r="2.5"/>
      <circle cx="2" cy="-7" r="2.5"/>
      <circle cx="6" cy="-4" r="2.5"/>
    </g>
  </g>

  <!-- Ground Line / Shadow -->
  <ellipse cx="250" cy="255" rx="200" ry="18" fill="#022c22" opacity="0.4"/>

  <!-- Pet Food Bowl in front of doghouse -->
  <g transform="translate(290, 205)">
    <path d="M0 25 L8 38 L52 38 L60 25 Z" fill="#047857"/>
    <ellipse cx="30" cy="25" rx="30" ry="8" fill="#059669"/>
    <!-- Pet kibble/food -->
    <ellipse cx="30" cy="23" rx="24" ry="6" fill="#b45309"/>
    <circle cx="25" cy="22" r="2" fill="#78350f"/>
    <circle cx="34" cy="22" r="2" fill="#78350f"/>
    <circle cx="29" cy="20" r="2" fill="#9a3412"/>
  </g>

  <!-- Friendly Floating Heart between animals -->
  <path d="M290 120 C290 108, 275 100, 265 110 C255 122, 270 140, 290 155 C310 140, 325 122, 315 110 C305 100, 290 108, 290 120 Z" fill="#34d399" opacity="0.75"/>

  <!-- Stray Dog (Left) -->
  <g transform="translate(140, 70)">
    <!-- Tail (wagging) -->
    <path d="M20 145 C-5 130, -10 105, 5 110" stroke="#d97706" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Back Body -->
    <path d="M40 170 C40 110, 80 90, 110 105 L110 175 L25 175 C25 155, 35 150, 40 170 Z" fill="#d97706"/>
    <!-- White Chest patch -->
    <path d="M75 115 C95 115, 105 135, 105 175 L65 175 C60 145, 65 120, 75 115 Z" fill="#ffffff"/>
    <!-- Left Foreleg -->
    <rect x="55" y="145" width="18" height="32" rx="9" fill="#ffffff"/>
    <!-- Right Foreleg -->
    <rect x="90" y="145" width="18" height="32" rx="9" fill="#ffffff"/>

    <!-- Dog Head -->
    <ellipse cx="85" cy="75" rx="34" ry="32" fill="#fed7aa"/>
    <!-- Brown patch on eye/ear -->
    <path d="M55 55 C45 65, 45 95, 75 95 C85 95, 75 60, 55 55 Z" fill="#d97706"/>
    <!-- Left Floppy Ear -->
    <ellipse cx="50" cy="70" rx="14" ry="24" fill="#b45309" transform="rotate(-15 50 70)"/>
    <!-- Right Floppy Ear -->
    <ellipse cx="120" cy="70" rx="14" ry="24" fill="#d97706" transform="rotate(15 120 70)"/>
    <!-- Muzzle / Snout -->
    <ellipse cx="85" cy="85" rx="18" ry="14" fill="#ffffff"/>
    <!-- Nose -->
    <ellipse cx="85" cy="78" rx="6" ry="4" fill="#0f172a"/>
    <path d="M85 82 L85 88 M80 88 Q85 92 90 88" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Eyes -->
    <circle cx="72" cy="68" r="4" fill="#0f172a"/>
    <circle cx="73" cy="66" r="1.5" fill="#ffffff"/>
    <circle cx="98" cy="68" r="4" fill="#0f172a"/>
    <circle cx="99" cy="66" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Cute Cat (Sitting next to dog) -->
  <g transform="translate(235, 130)">
    <!-- Cat Body -->
    <path d="M25 80 C20 50, 45 40, 55 45 C65 40, 90 50, 85 80 L85 115 L25 115 Z" fill="#ffffff"/>
    <!-- Black patch on cat body -->
    <path d="M70 65 C85 70, 90 95, 85 115 L60 115 C55 85, 60 70, 70 65 Z" fill="#334155"/>
    <!-- Cat Tail curling -->
    <path d="M85 105 C105 105, 115 85, 105 75" stroke="#334155" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Cat Head -->
    <ellipse cx="55" cy="35" rx="25" ry="22" fill="#ffffff"/>
    <!-- Black patch on ear/head -->
    <path d="M35 18 C30 25, 45 35, 45 20 Z" fill="#334155"/>
    <path d="M68 18 C78 25, 62 35, 65 20 Z" fill="#334155"/>
    <!-- Ears -->
    <polygon points="32,25 36,5 48,20" fill="#fed7aa"/>
    <polygon points="34,22 38,10 46,20" fill="#fda4af"/>
    <polygon points="62,20 74,5 78,25" fill="#334155"/>
    <polygon points="64,20 72,10 76,22" fill="#fda4af"/>
    <!-- Eyes -->
    <circle cx="46" cy="34" r="3.5" fill="#0f172a"/>
    <circle cx="47" cy="33" r="1.2" fill="#ffffff"/>
    <circle cx="64" cy="34" r="3.5" fill="#0f172a"/>
    <circle cx="65" cy="33" r="1.2" fill="#ffffff"/>
    <!-- Nose & Whiskers -->
    <polygon points="53,40 57,40 55,42" fill="#f43f5e"/>
    <path d="M52 43 Q55 46 58 43" stroke="#0f172a" stroke-width="1.5" fill="none"/>
    <!-- Whiskers -->
    <line x1="33" y1="39" x2="42" y2="41" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="33" y1="44" x2="42" y2="43" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="68" y1="41" x2="77" y2="39" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="68" y1="43" x2="77" y2="44" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
